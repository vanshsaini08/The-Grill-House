<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | The Grill House</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="nav-left">

            <img src="images/logo 1.png"
                 alt="Logo"
                 class="logo-img">

            <div class="toggle-container" onclick="toggleMode()">

                <span class="label-text">DINE-IN</span>

                <div id="switch" class="toggle-switch"></div>

                <span class="label-text">TAKEAWAY</span>

            </div>

        </div>


        <div class="nav-right">

            <span class="nav-item"
                  onclick="window.location.href='special.html'">

                <i class="fas fa-tag"></i>

                SPECIAL OFFERS

            </span>


            <span class="nav-item" id="loginBtn">

                <i class="fas fa-user"></i>

                MY PROFILE

            </span>


            <span class="nav-item cart-nav" id="cartNav">

                <span class="cart-icon-wrapper">

                    <i class="fas fa-shopping-bag"></i>

                    <span id="navCartCount"
                          class="nav-cart-badge">0</span>

                </span>

                <span>CART</span>

            </span>


            <button class="search-btn"
                    onclick="window.location.href='search.html'">

                <i class="fas fa-search"></i>

            </button>

        </div>

    </nav>



    <!-- =====================================================
         BREADCRUMB
    ====================================================== -->

    <div class="profile-breadcrumb">

        <a href="index.html">Home</a>

        <span>/</span>

        <span>My Profile</span>

    </div>



    <!-- =====================================================
         MAIN PROFILE
    ====================================================== -->

    <main class="profile-shell">


        <!-- =================================================
             LEFT SIDEBAR
        ================================================== -->

        <aside class="profile-sidebar">


            <!-- USER BLOCK -->

            <div class="profile-user-block">

                <div class="profile-user">

                    <div class="profile-avatar"
                         id="profileAvatar">

                        VS

                    </div>


                    <div class="profile-user-info">

                        <h3 id="profileName">
                            Guest
                        </h3>

                        <p id="profilePhone">
                            +91 —
                        </p>

                    </div>

                </div>

            </div>



            <!-- RECENT ORDERS -->

            <div class="profile-menu-block">

                <button class="active"
                        data-section="orders">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span>Recent Orders</span>

                </button>

            </div>



            <!-- SAVED DEALS -->

            <div class="profile-menu-block">

                <button data-section="deals">

                    <i class="fa-solid fa-ticket"></i>

                    <span>Saved Deals</span>

                </button>

            </div>



            <!-- BK WALL -->

            <div class="profile-menu-block">

                <button data-section="about">

                    <i class="fa-solid fa-table-cells-large"></i>

                    <span>Grill Wall</span>

                </button>

            </div>



            <!-- NOTIFICATIONS -->

            <div class="profile-menu-block notification-block">

                <button data-section="notifications">

                    <i class="fa-solid fa-bell"></i>

                    <span>Notifications</span>

                    <span class="notification-dot"></span>

                </button>

            </div>



            <!-- SUPPORT -->

            <div class="profile-menu-block">

                <button data-section="support">

                    <i class="fa-solid fa-circle-question"></i>

                    <span>FAQ's &amp; Support</span>

                </button>

            </div>



            <!-- SETTINGS -->

            <div class="profile-menu-block">

                <button data-section="settings">

                    <i class="fa-solid fa-gear"></i>

                    <span>Settings</span>

                    <i class="fa-solid fa-chevron-down settings-arrow"></i>

                </button>

            </div>



            <!-- LOGOUT -->

            <div class="profile-menu-block logout-block">

                <button class="logout"
                        id="logoutBtn">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>Logout</span>

                </button>

            </div>


        </aside>



        <!-- =================================================
             RIGHT CONTENT
        ================================================== -->

        <section class="profile-content">

            <div id="profileContent"></div>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>
    <script src="cart.js"></script>
    <script src="profile.js"></script>
    <script src="rate-order.js"></script>

</body>

</html>
