<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search | The Grill House</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="los.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="search-page-body">

    <!-- ================= LOGIN POPUP ================= -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-popup">
        <button class="close-popup">&times;</button>
        <div class="login-logo">
            <img src="images/logo 1.png" alt="Logo">
        </div>
        <h2>Welcome</h2>
        <p class="login-text" id="loginMessage">
            Enter your mobile number to continue
        </p>
        <!-- Name (Only New Customer) -->
        <div class="input-box" id="nameBox" style="display:none;">
            <input type="text" id="txtName"placeholder="Enter your full name">
        </div>
        <!-- Mobile Number -->
        <div class="mobile-box" id="mobileBox">
            <span>+91</span>
            <input type="text" id="txtPhone"maxlength="10"placeholder="Enter mobile number">
        </div>
        <!-- OTP Box (Hidden) -->
        <div class="input-box" id="otpBox" style="display:none;">
            <input type="text"id="txtOTP"maxlength="6"placeholder="Enter 6 Digit OTP">
        </div>
        <!-- Main Button -->
        <button id="continueBtn">
            CONTINUE
        </button>
        <!-- Back Button -->
        <button id="backBtn" style="display:none;
                   margin-top:10px;
                   width:100%;
                   padding:12px;
                   border:none;
                   border-radius:8px;
                   cursor:pointer;
                   background:#ececec;">
            BACK
        </button>
      
        <div class="popup-footer">
            By continuing you agree to our
            <a href="#">Terms & Conditions</a>
            &
            <a href="#">Privacy Policy</a>
        </div>
    </div>
</div>
<!-- navbar -->
<nav class="navbar">
    <div class="nav-left">
        <img src="images/logo 1.png" alt="Logo" class="logo-img">
        <div class="toggle-container" onclick="toggleMode()">
            <span class="label-text">DINE-IN</span>
            <div id="switch" class="toggle-switch"></div>
            <span class="label-text">TAKEAWAY</span>
        </div>
    </div>
    
    <div class="nav-right">
        <span class="nav-item" onclick="window.location.href='special.html'"><i class="fas fa-tag"></i> SPECIAL OFFERS</span>
        <!-- <span class="nav-item"><i class="fas fa-chair"></i> TABLE ZONE</span> -->
        <span class="nav-item" id="loginBtn">
    <i class="fas fa-user"></i> LOGIN
</span>
        <span class="nav-item"><i class="fas fa-shopping-bag"></i> CART</span>
        <button class="search-btn" onclick="window.location.href='search.html'"><i class="fas fa-search"></i></button>
    </div>
</nav>
<div class="profile-breadcrumb"><a href="index.html">Home</a>
    <span>/</span> Search</div>

<!-- ================= SEARCH ================= -->

<div class="search-container">

    <!-- SEARCH INPUT -->
    <div class="search-input-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search here..."
            autocomplete="off"
        >

        <button
            type="button"
            id="clearBtn"
            class="clear-btn"
            onclick="clearSearch()"
        >
            ✕
        </button>

    </div>

<!-- ================= PRODUCT POPUP ================= -->

<div class="product-overlay" id="productOverlay">

    <div class="product-popup">

        <span class="close-product">&times;</span>

        <img
            id="popupImage"
            src=""
            alt="Product"
        >

        <h2 id="popupTitle"></h2>

        <p id="popupDescription"></p>

        <h3 id="popupPrice">₹0.00</h3>

        <div class="qty-box">

            <button id="minusQty">−</button>

            <span id="qtyValue">1</span>

            <button id="plusQty">+</button>

        </div>

        <button id="popupAddCart">
            ADD TO CART
        </button>

    </div>

</div>
    <!-- ================= POPULAR SEARCHES ================= -->

    <div class="popular-section">

        <p>POPULAR SEARCHES</p>

        <div class="popular-searches">

            <button
                type="button"
                onclick="searchPopular('Pizza')"
            >
                Pizza
            </button>

            <button
                type="button"
                onclick="searchPopular('Burger')"
            >
                Burger
            </button>

            <!-- <button
                type="button"
                onclick="searchPopular('Fries')"
            >
                Fries
            </button>

            <button
                type="button"
                onclick="searchPopular('Cake')"
            >
                Cake
            </button>

            <button
                type="button"
                onclick="searchPopular('Coke')"
            >
                Coke
            </button> -->

        </div>

    </div>


    <!-- ================= SEARCH RESULTS ================= -->

    <section class="search-results-section">

        <h2 id="searchResultTitle"></h2>

        <div
            id="searchResults"
            class="products"
        >

            <!-- Search products JavaScript se load honge -->

        </div>

        <!-- NO RESULTS -->
        <div
            id="noSearchResults"
            class="no-search-results"
            style="display:none;"
        >

            <i class="fas fa-search"></i>

            <h3>No items found</h3>

            <p>
                Try searching for another food item.
            </p>

        </div>

    </section>

</div>

<script src="cart.js"></script>
<script src="script.js"></script>
<script src="menu.js"></script>
<script src="seach.js"></script>
<script type="module" src="js/firebase-login.js"></script>
</body>
</html>
